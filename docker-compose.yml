x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgres://ticketing:ticketing@db:5432/ticketing
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-local-only}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ticketing"]
      interval: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

volumes:
  pgdata:
